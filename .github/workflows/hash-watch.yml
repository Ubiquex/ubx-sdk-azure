name: hash-watch

# UBI-222: rebuilt on top of manifest.json's own new schema_urls field
# (ubx-provider-dynamic PR #50) instead of ubiquex's own live
# [dynamic_provider_groups.azure_all] table -- UBI-182 Stage E
# collapsed that table down to a bare source/version pin months ago,
# and this file was never updated to match. It kept reading a table
# that no longer existed: a real KeyError on the very first line that
# touched it, confirmed failed on 2026-08-27 (both scheduled runs that
# day), a red X nobody saw, because nothing distinguished "this check
# is broken" from ordinary CI noise. This rewrite closes both real
# gaps at once: drift detection now reads the same published artifact
# (ubx-schema-azure's own manifest.json) that snapshot cutting and
# `ubx sdk gen`'s own pinned resolution already read, and every real
# outcome -- clean, drift found, or genuinely unable to check -- is a
# distinct, surfaced state, not a bare pass/fail.
#
# Three real states, never conflated:
#   clean -- checked, live content matches the last cut snapshot.
#   drift -- checked, live content changed. Opens a tracking issue
#     naming exactly what changed (never auto-regenerates: cutting a
#     new pinned snapshot, publishing it, and bumping ubiquex's own
#     pin is a real, judgment-requiring act this workflow does not
#     take unattended -- matching this org's own publish-descriptions.yml
#     precedent for exactly this kind of cut).
#   error -- could NOT check (schema_urls missing because this
#     provider's own snapshot hasn't been re-cut with a binary new
#     enough to record it yet, a live fetch failed, network/rate-limit,
#     etc.). Opens a SEPARATE tracking issue, its own label -- an error
#     must never look like "nothing to report" from outside CI. This is
#     exactly the class of silent failure this rewrite exists to close.
#
# This never touches ubiquex or ubx-provider-dynamic at all for the
# compare step -- manifest.json (ubx-schema-azure, already published,
# already public, no auth) is the only real input.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  REPO_NAME: azure
  SCHEMA_REPO: ubx-schema-azure
  ERROR_ISSUE_LABEL: hash-watch-error
  DRIFT_ISSUE_LABEL: hash-watch-drift

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.compare.outputs.state }}
    steps:
      - name: Check out ubx-sdk-azure
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up PyYAML
        run: pip install --quiet pyyaml

      - name: Fetch manifest.json, fetch every real member's own live spec, compare
        id: compare
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import hashlib, json, os, time, urllib.error, urllib.request, yaml, datetime

          SCHEMA_REPO = os.environ["SCHEMA_REPO"]

          def write_output(**kv):
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  for k, v in kv.items():
                      out.write(f"{k}={v}\n")

          def fetch(url, retries=5):
              req = urllib.request.Request(url, headers={"User-Agent": "ubx-hash-watch"})
              for i in range(retries):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return resp.read()
                  except urllib.error.HTTPError as e:
                      if i == retries - 1:
                          raise
                      retry_after = e.headers.get("Retry-After") if e.code == 429 else None
                      time.sleep(float(retry_after) if retry_after else 5 * (2 ** i))
                  except Exception:
                      if i == retries - 1:
                          raise
                      time.sleep(5 * (2 ** i))

          def json_default(o):
              if isinstance(o, (datetime.date, datetime.datetime)):
                  return o.isoformat()
              raise TypeError(f"not JSON serializable: {o!r}")

          def canonicalize(raw_bytes):
              text = raw_bytes.decode("utf-8")
              try:
                  doc = json.loads(text)
              except json.JSONDecodeError:
                  doc = yaml.safe_load(text)
              if isinstance(doc, dict) and "revision" in doc:
                  doc = {k: v for k, v in doc.items() if k != "revision"}
              return json.dumps(doc, sort_keys=True, separators=(",", ":"), default=json_default).encode("utf-8")

          try:
              manifest_url = f"https://raw.githubusercontent.com/Ubiquex/{SCHEMA_REPO}/main/manifest.json"
              manifest = json.loads(fetch(manifest_url))
              schema_urls = manifest.get("schema_urls") or {}
              members = manifest.get("members", [])

              if not schema_urls:
                  write_output(
                      state="error",
                      detail=f"{SCHEMA_REPO}'s own manifest.json has {len(members)} real member(s) but no "
                             f"schema_urls at all -- this provider's own snapshot has not been re-cut with a "
                             f"ubx-provider-dynamic build new enough to record it yet (UBI-222, PR #50). "
                             f"Nothing was checked.",
              )
              else:
                  missing = [m for m in members if m not in schema_urls]
                  distinct_urls = sorted(set(schema_urls.values()))
                  h = hashlib.sha256()
                  for i, url in enumerate(distinct_urls):
                      if i > 0:
                          time.sleep(1.0)
                      h.update(canonicalize(fetch(url)))
                  live_hash = h.hexdigest()

                  current = None
                  if os.path.exists("VERSION"):
                      for line in open("VERSION"):
                          if line.startswith("merged-spec-sha256:"):
                              current = line.split()[1]
                              break

                  if current is None:
                      write_output(state="error", detail="VERSION has no merged-spec-sha256 line to compare against.")
                  elif missing:
                      write_output(
                          state="error",
                          detail=f"manifest.json's own schema_urls is missing {len(missing)} of {len(members)} "
                                 f"real member(s): {missing}. Partial data is not a safe basis for a real compare.",
                      )
                  elif live_hash == current:
                      write_output(state="clean", detail=f"live merged-spec-sha256 {live_hash} matches VERSION.")
                  else:
                      write_output(
                          state="drift",
                          detail=f"live merged-spec-sha256 {live_hash} does not match VERSION's own {current} "
                                 f"({len(distinct_urls)} distinct source(s) checked).",
                      )
          except Exception as e:
              write_output(state="error", detail=f"real, unhandled failure while checking: {e!r}")
          PYEOF

      - name: Find any existing error/drift tracking issue
        id: existing
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          error_number="$(gh issue list --label "$ERROR_ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          drift_number="$(gh issue list --label "$DRIFT_ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          echo "error_number=$error_number" >> "$GITHUB_OUTPUT"
          echo "drift_number=$drift_number" >> "$GITHUB_OUTPUT"

      - name: Surface an error state -- never allowed to look like "nothing to report"
        if: steps.compare.outputs.state == 'error'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="**hash-watch could not check this repo for drift.**

          ${{ steps.compare.outputs.detail }}

          Full workflow run: $run_url"
          if [ -n "${{ steps.existing.outputs.error_number }}" ]; then
            gh issue comment "${{ steps.existing.outputs.error_number }}" --body "$body"
          else
            gh issue create --title "hash-watch: unable to check for drift" --label "$ERROR_ISSUE_LABEL" --body "$body"
          fi

      - name: Close a stale error tracking issue once checking works again
        if: steps.compare.outputs.state != 'error' && steps.existing.outputs.error_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue close "${{ steps.existing.outputs.error_number }}" \
            --comment "hash-watch checked successfully on this run (state: ${{ steps.compare.outputs.state }}) -- closing."

      - name: Report real drift -- opens a tracking issue, never auto-regenerates
        if: steps.compare.outputs.state == 'drift'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="**Real schema drift found against the live source.**

          ${{ steps.compare.outputs.detail }}

          Cutting a new pinned snapshot, publishing it as a new $SCHEMA_REPO release, and bumping
          ubiquex's own [dynamic_providers.$REPO_NAME] pin is a real, judgment-requiring act -- not
          auto-applied here (this org's own publish-descriptions.yml sets the same precedent for this
          class of cut). See ubx-provider-dynamic's own --generate-snapshot-group.

          Full workflow run: $run_url"
          if [ -n "${{ steps.existing.outputs.drift_number }}" ]; then
            gh issue comment "${{ steps.existing.outputs.drift_number }}" --body "$body"
          else
            gh issue create --title "hash-watch: real drift found against the live source" --label "$DRIFT_ISSUE_LABEL" --body "$body"
          fi

      - name: Close a stale drift tracking issue once content is clean again
        if: steps.compare.outputs.state == 'clean' && steps.existing.outputs.drift_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue close "${{ steps.existing.outputs.drift_number }}" \
            --comment "hash-watch found this repo clean on this run -- closing."

      - name: Fail this run's own status on error or drift, so it never shows green by accident
        if: steps.compare.outputs.state != 'clean'
        run: |
          echo "state: ${{ steps.compare.outputs.state }} -- ${{ steps.compare.outputs.detail }}"
          exit 1
