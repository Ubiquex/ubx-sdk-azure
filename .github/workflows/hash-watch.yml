name: hash-watch

# Weekly check against every real, live member spec behind
# [dynamic_provider_groups.azure_all] (ubiquex, sdk/providers/.ubx/config)
# for content drift. Azure publishes no single, discrete, pinnable release
# for this corpus -- each of the 302 real [dynamic_providers.azure*]
# entries pins its own dated ARM API-version folder independently
# (stable/2026-04-01, one date per family, never one global version) --
# there is no version number to poll the way version-watch.yml did for
# this repo's own pre-1.0.0, hashicorp/azurerm-sourced form.
#
# NEW at 1.1.0: this repo has never had an automated drift watch since
# regenerating from the real ARM corpus. version-watch.yml (the
# hashicorp/azurerm-era workflow) was removed at 1.0.0 as part of that
# regeneration -- real, deliberate, and flagged at the time as follow-up
# work, not done in that PR. This is that follow-up.
#
# Rather than reconstruct the group's own 302-member list by hand here (a
# real, live drift risk of its own if ubiquex's config ever adds/removes
# a member and this file isn't updated in lockstep), this checks out
# ubiquex fresh and runs `ubx sdk gen --only azure_all --dump-ir`
# directly against ITS real, live, checked-in .ubx/config -- the group's
# own member list is never duplicated here, only ever read from the one
# real source of truth. The merged-schema-sha256 is computed identically
# to how VERSION's own committed value is computed: a SHA-256 of the
# canonical (sort_keys, compact separators) JSON serialization of the
# combined, real, post-enrichment IR (--dump-ir's own schema.json shape)
# covering every member at once.
#
# Ported from ubx-sdk-google's own version-watch.yml (the real, working
# reference for the combined-repo layout and the regen/build steps), and
# from ubx-sdk-datadog's own real, working merged-hash rewrite of this
# same file (the same real multi-source problem, applied here rather than
# re-solved from scratch).

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  GROUP: azure_all
  REPO_NAME: azure

jobs:
  check-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ubx-sdk-azure
        uses: actions/checkout@v4

      - name: Check out ubiquex and ubx-provider-dynamic (real source of truth for the group's own member list)
        run: |
          set -euo pipefail
          # Fine-grained PAT, contents:read on BOTH Ubiquex/ubiquex and
          # Ubiquex/ubx-provider-dynamic -- same UBIQUEX_SOURCE_TOKEN
          # secret this repo's own publish.yml/prior hash-watch.yml use.
          git clone --depth=1 \
            "https://x-access-token:${{ secrets.UBIQUEX_SOURCE_TOKEN }}@github.com/Ubiquex/ubiquex.git" \
            "${{ runner.temp }}/ubiquex-src"
          git clone --depth=1 \
            "https://x-access-token:${{ secrets.UBIQUEX_SOURCE_TOKEN }}@github.com/Ubiquex/ubx-provider-dynamic.git" \
            "${{ runner.temp }}/ubx-provider-dynamic-src"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/ubiquex-src/go.mod

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build ubx
        run: |
          set -euo pipefail
          go build -C "${{ runner.temp }}/ubiquex-src" -o "${{ runner.temp }}/ubx" ./cmd/ubx
          "${{ runner.temp }}/ubx" version

      - name: Fetch every member and compute the merged-schema-sha256
        id: merged
        env:
          UBX_PROVIDER_DYNAMIC_REPO: ${{ runner.temp }}/ubx-provider-dynamic-src
        run: |
          set -euo pipefail
          dumpdir="${{ runner.temp }}/dump"
          mkdir -p "$dumpdir"
          out="$(cd "${{ runner.temp }}/ubiquex-src/sdk/providers" && "${{ runner.temp }}/ubx" sdk gen --only "$GROUP" --dump-ir "$dumpdir" --out "${{ runner.temp }}/genout-unused" 2>&1)"
          echo "$out"
          members="$(echo "$out" | grep -oE '\([0-9]+ members\)' | grep -oE '[0-9]+')"
          if [ -z "$members" ]; then
            echo "could not parse member count from ubx sdk gen output" >&2
            exit 1
          fi
          echo "members=$members" >> "$GITHUB_OUTPUT"
          hash="$(python3 -c "
          import json, hashlib
          d = json.load(open('$dumpdir/$REPO_NAME/schema.json'))
          canonical = json.dumps(d, sort_keys=True, separators=(',', ':')).encode('utf-8')
          print(hashlib.sha256(canonical).hexdigest())
          ")"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Live merged-schema-sha256: $hash ($members members)"
          echo "$dumpdir" > /tmp/dumpdir_path

      - name: Compare against this repo's committed VERSION
        id: compare
        run: |
          set -euo pipefail
          current_hash="$(grep '^merged-schema-sha256:' VERSION | awk '{print $2}')"
          current_members="$(grep '^members:' VERSION | awk '{print $2}')"
          echo "current_hash=$current_hash" >> "$GITHUB_OUTPUT"
          echo "current_members=$current_members" >> "$GITHUB_OUTPUT"
          echo "This repo was last generated from merged-schema-sha256: $current_hash ($current_members members)"
          if [ "$current_hash" = "${{ steps.merged.outputs.hash }}" ] && [ "$current_members" = "${{ steps.merged.outputs.members }}" ]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
            echo "Already current -- nothing to do."
          else
            echo "newer=true" >> "$GITHUB_OUTPUT"
          fi

      # --- everything below only runs when the merged corpus changed ---

      - name: Regenerate bindings (all three languages, through the real group)
        if: steps.compare.outputs.newer == 'true'
        env:
          UBX_PROVIDER_DYNAMIC_REPO: ${{ runner.temp }}/ubx-provider-dynamic-src
        run: |
          set -euo pipefail
          gendir="${{ runner.temp }}/ubxgen"
          mkdir -p "$gendir"

          own_ts_version="$(python3 -c "import json; print(json.load(open('sdk/typescript/package.json'))['version'])")"
          own_py_version="$(python3 -c "import tomllib; print(tomllib.load(open('sdk/python/pyproject.toml','rb'))['project']['version'])")"

          mkdir -p "$gendir/out/$REPO_NAME/sdk/go"
          cp sdk/go/go.mod "$gendir/out/$REPO_NAME/sdk/go/go.mod"

          for lang in go ts py; do
            ( cd "${{ runner.temp }}/ubiquex-src/sdk/providers" && "${{ runner.temp }}/ubx" sdk gen --only "$GROUP" --lang "$lang" --out "$gendir/out" )
          done

          rsync -a --delete --exclude='go.sum' "$gendir/out/$REPO_NAME/sdk/go/" sdk/go/
          rsync -a --delete --exclude='deno.json' --exclude='deno.lock' "$gendir/out/$REPO_NAME/sdk/typescript/" sdk/typescript/
          rsync -a --delete "$gendir/out/$REPO_NAME/sdk/python/" sdk/python/

          python3 -c "
          import json
          p = 'sdk/typescript/package.json'
          d = json.load(open(p))
          d['version'] = '$own_ts_version'
          json.dump(d, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          "
          python3 -c "
          import re
          p = 'sdk/python/pyproject.toml'
          content = open(p).read()
          content = re.sub(r'version = \"[^\"]+\"', 'version = \"$own_py_version\"', content, count=1)
          open(p, 'w').write(content)
          "

          cat > VERSION <<EOF
          merged-schema-sha256: ${{ steps.merged.outputs.hash }}
          members: ${{ steps.merged.outputs.members }}
          fetched: $(date -u +%Y-%m-%d)
          source: [dynamic_provider_groups.$GROUP] in ubiquex (sdk/providers/.ubx/config)
          EOF

      - name: Refresh sdk/typescript/deno.json's exports map for the regenerated tree
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          python3 - <<PYEOF
          import json, os

          with open("sdk/typescript/deno.json") as fh:
              cfg = json.load(fh)

          exports = {}
          for dirpath, _, filenames in os.walk("sdk/typescript/$REPO_NAME"):
              for f in sorted(filenames):
                  if not f.endswith(".ts"):
                      continue
                  rel = os.path.relpath(os.path.join(dirpath, f), "sdk/typescript")
                  exports["./" + rel[:-3]] = "./" + rel

          cfg["exports"] = exports

          with open("sdk/typescript/deno.json", "w") as fh:
              json.dump(cfg, fh, indent=2)
              fh.write("\n")

          print(f"sdk/typescript/deno.json exports: {len(exports)} entries")
          PYEOF

      - name: Regenerate sdk/go/go.sum
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          cd sdk/go
          go mod tidy

      - name: Sanity-check the regenerated Go tree still builds
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          cd sdk/go
          go build ./...
          go vet ./...

      - name: Sanity-check the regenerated TS tree still typechecks
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          cd sdk/typescript
          find . -name "*.ts" -print0 | xargs -0 deno cache
          find . -name "*.ts" -print0 | xargs -0 deno check --frozen

      - name: Sanity-check the regenerated Python tree -- real import of every module
        if: steps.compare.outputs.newer == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          deps="$(cd sdk/python && python3 -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")"
          pip install $deps
          python3 - <<'PYEOF'
          import os, sys, importlib

          repo_root = os.path.join(os.getcwd(), "sdk", "python")
          sys.path.insert(0, repo_root)

          count = 0
          errors = []
          for dirpath, dirnames, filenames in os.walk(repo_root):
              for f in filenames:
                  if not f.endswith(".py"):
                      continue
                  rel = os.path.relpath(os.path.join(dirpath, f), repo_root)
                  mod = rel[:-3].replace(os.sep, ".")
                  if mod.endswith(".__init__"):
                      mod = mod[: -len(".__init__")]
                  try:
                      importlib.import_module(mod)
                      count += 1
                  except Exception as e:
                      errors.append((mod, str(e)))

          print(f"imported {count} modules OK")
          if errors:
              print(f"{len(errors)} ERRORS:")
              for m, e in errors:
                  print(f"  {m}: {e}")
              sys.exit(1)
          print("ZERO errors")
          PYEOF

      - name: Open PR
        if: steps.compare.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ubx-bot"
          git config user.email "actions@users.noreply.github.com"
          short="$(echo "${{ steps.merged.outputs.hash }}" | cut -c1-12)"
          branch="sdk-regen/azure-$short"
          git checkout -b "$branch"
          git add -A
          git commit -m "sdk: regenerate from azure_all merged corpus $short"
          git push origin "$branch" --force
          gh pr create \
            --title "sdk: regenerate from azure_all merged corpus $short" \
            --body "Automated regeneration (\`.github/workflows/hash-watch.yml\`) triggered by a merged-corpus content change across [dynamic_provider_groups.azure_all]'s own members -- all three languages (sdk/go/, sdk/typescript/, sdk/python/) regenerated together in this one PR.

          Previous merged-schema-sha256: \`${{ steps.compare.outputs.current_hash }}\` (${{ steps.compare.outputs.current_members }} members)
          New merged-schema-sha256: \`${{ steps.merged.outputs.hash }}\` (${{ steps.merged.outputs.members }} members)

          New files = new resource. Modified files = an existing resource's schema changed. Removed files = a resource dropped out of the corpus (a member removed, or the resource itself removed upstream). This never auto-merges -- review the diff before merging." \
            --base main --head "$branch"
